[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-voice-vad"
version = "1.0.1"
description = "Energy and transcript heuristics for voice turn endpoint detection."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "GenPark AI Engineering"}]
dependencies = []
keywords = ["genpark", "mcp", "ai-agent", "python"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/Alpha-Park/genpark-voice-turn-taking-endpoint-detector-skill"
Documentation = "https://github.com/Alpha-Park/genpark-voice-turn-taking-endpoint-detector-skill#readme"
Issues = "https://github.com/Alpha-Park/genpark-voice-turn-taking-endpoint-detector-skill/issues"
Homepage = "https://genpark.ai/mcp"

[project.scripts]
genpark-voice-vad = "genpark_voice_vad.server:main"

[tool.setuptools.packages.find]
include = ["genpark_voice_vad*"]
